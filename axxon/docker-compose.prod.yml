# Defines the production stack with bundled Postgres and Redis plus a one-shot migration task.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:?PG_USER is required}
      POSTGRES_PASSWORD: ${PG_PASS:?PG_PASS is required}
      POSTGRES_DB: ${PG_DB:?PG_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist Redis state between production restarts.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-prod
    restart: "no"
    # Run schema migrations once per deploy before the long-lived app services start.
    command: ["pnpm", "migrate:latest:prod"]
    env_file:
      - .env.production
    environment:
      AXXON_DEPLOY_STAGE: ${AXXON_DEPLOY_STAGE:-production}
      AXXON_ENV_MODE: docker
      NODE_ENV: production
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: ${PG_USER:?PG_USER is required}
      PG_PASS: ${PG_PASS:?PG_PASS is required}
      PG_DB: ${PG_DB:?PG_DB is required}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-prod
      # These build args populate the browser bundle because NEXT_PUBLIC_* is compiled into Next.js output.
      args:
        NEXT_PUBLIC_REDIRECT_URI: ${NEXT_PUBLIC_REDIRECT_URI:-}
        NEXT_PUBLIC_HOSTNAME: ${NEXT_PUBLIC_HOSTNAME:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
    restart: unless-stopped
    # Runtime envs are still required for the server-side OAuth exchange and DB access.
    env_file:
      - .env.production
    environment:
      AXXON_DEPLOY_STAGE: ${AXXON_DEPLOY_STAGE:-production}
      AXXON_ENV_MODE: docker
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: ${PG_USER:?PG_USER is required}
      PG_PASS: ${PG_PASS:?PG_PASS is required}
      PG_DB: ${PG_DB:?PG_DB is required}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: ws-prod
    restart: unless-stopped
    # Runtime envs are loaded here because the websocket server verifies JWTs and hits the database.
    env_file:
      - .env.production
    environment:
      AXXON_DEPLOY_STAGE: ${AXXON_DEPLOY_STAGE:-production}
      AXXON_ENV_MODE: docker
      NODE_ENV: production
      WS_PORT: 4000
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: ${PG_USER:?PG_USER is required}
      PG_PASS: ${PG_PASS:?PG_PASS is required}
      PG_DB: ${PG_DB:?PG_DB is required}
      REDIS_URL: redis://redis:6379
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    # Bind to loopback by default so a reverse proxy can expose the websocket service intentionally.
    ports:
      - "${WS_BIND_HOST:-127.0.0.1}:${WS_PUBLIC_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const socket=net.connect(4000,'127.0.0.1');socket.on('connect',()=>{socket.end();process.exit(0);});socket.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),5000);\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  redis_data:
  postgres_data:

# Defines the Coolify production stack with hosted Postgres, bundled Redis, and a migration task excluded from Coolify health checks.
x-runtime-env: &runtime-env
  AXXON_DEPLOY_STAGE: ${AXXON_DEPLOY_STAGE:-production}
  AXXON_ENV_MODE: docker
  NODE_ENV: production
  APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
  CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  NEXT_PUBLIC_HOSTNAME: ${NEXT_PUBLIC_HOSTNAME:?NEXT_PUBLIC_HOSTNAME is required}
  NEXT_PUBLIC_REDIRECT_URI: ${NEXT_PUBLIC_REDIRECT_URI:?NEXT_PUBLIC_REDIRECT_URI is required}
  NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required}
  PG_CONNECTION_STRING: ${PG_CONNECTION_STRING:?PG_CONNECTION_STRING is required}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  AI_CLOUD_BASE_URL: ${AI_CLOUD_BASE_URL:-}
  AI_CLOUD_MODEL: ${AI_CLOUD_MODEL:-}
  AI_CLOUD_API_KEY: ${AI_CLOUD_API_KEY:-}
  AI_LOCAL_BASE_URL: ${AI_LOCAL_BASE_URL:-}
  AI_LOCAL_MODEL: ${AI_LOCAL_MODEL:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
  GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist Redis state between production restarts.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-prod
    restart: "no"
    exclude_from_hc: true
    # Run schema migrations once per deploy before the long-lived app services start.
    command: ["pnpm", "migrate:latest:prod"]
    environment: *runtime-env

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-prod
      # These build args populate the browser bundle because NEXT_PUBLIC_* is compiled into Next.js output.
      args:
        NEXT_PUBLIC_REDIRECT_URI: ${NEXT_PUBLIC_REDIRECT_URI:-}
        NEXT_PUBLIC_HOSTNAME: ${NEXT_PUBLIC_HOSTNAME:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
    restart: unless-stopped
    # Runtime envs are still required for the server-side OAuth exchange and DB access.
    environment:
      <<: *runtime-env
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: ws-prod
    restart: unless-stopped
    # Runtime envs are loaded here because the websocket server verifies JWTs and hits the database.
    environment:
      <<: *runtime-env
      WS_PORT: 4000
    expose:
      - "4000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const net=require('net');const socket=net.connect(4000,'127.0.0.1');socket.on('connect',()=>{socket.end();process.exit(0);});socket.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),5000);\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  redis_data:

# Defines the local development stack, including one-shot database bootstrap and app runtime services.
services:
  db:
    image: postgres:16-alpine
    ports:
      - "${PG_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASS:-postgres}
      POSTGRES_DB: ${PG_DB:-axxon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-dev
    command: ["sh", "./scripts/docker-dev-entrypoint.sh", "pnpm", "db:bootstrap"]
    env_file:
      - .env.local
      - .env.docker
    environment:
      NODE_ENV: development
      PG_HOST: db
      PG_HOST_FALLBACK: host.docker.internal
      PG_PORT: 5432
      PG_CONNECTION_STRING: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - db_init_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Next.js runs separately from the websocket process so each service can restart independently.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-dev
    command: ["sh", "./scripts/docker-dev-entrypoint.sh", "pnpm", "dev-next"]
    # Load runtime secrets and OAuth config without baking them into the dev image.
    env_file:
      - .env.local
      - .env.docker
    environment:
      AXXON_DEPLOY_STAGE: ${AXXON_DEPLOY_STAGE:-development}
      # Docker dev talks to a host-run Ollama instance through the host gateway instead of a sibling container.
      AI_LOCAL_BASE_URL: ${AI_LOCAL_BASE_URL:-http://host.docker.internal:11434}
      AI_LOCAL_MODEL: ${AI_LOCAL_MODEL:-qwen2.5-coder:14b}
      NODE_ENV: development
      HOSTNAME: 0.0.0.0
      PORT: 3000
      PG_CONNECTION_STRING: ""
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: ws-dev
    command: ["sh", "./scripts/docker-dev-entrypoint.sh", "pnpm", "dev-ws"]
    # The websocket service needs the same auth and DB envs as the app to validate sessions.
    env_file:
      - .env.local
      - .env.docker
    environment:
      NODE_ENV: development
      WS_PORT: 4000
      PG_CONNECTION_STRING: ""
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - ws_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: ws-dev
    command: ["sh", "./scripts/docker-dev-entrypoint.sh", "pnpm", "agent:worker"]
    env_file:
      - .env.local
      - .env.docker
    environment:
      NODE_ENV: development
      AXXON_DEPLOY_STAGE: ${AXXON_DEPLOY_STAGE:-development}
      AI_LOCAL_BASE_URL: ${AI_LOCAL_BASE_URL:-http://host.docker.internal:11434}
      AI_LOCAL_MODEL: ${AI_LOCAL_MODEL:-qwen2.5-coder:14b}
      PG_CONNECTION_STRING: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - agent_worker_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

volumes:
  app_node_modules:
  app_next:
  ws_node_modules:
  agent_worker_node_modules:
  db_init_node_modules:
  redis_data:
  postgres_data:
    name: axxon_postgres_data

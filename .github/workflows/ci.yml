# Runs pull request validation for main, verifies migrations against a throwaway database, and applies production migrations on main pushes.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      planning_eval_tier:
        description: Planning eval tier to run
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - golden
          - judge
          - release

permissions:
  contents: read

jobs:
  lint_and_typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axxon
    env:
      NODE_ENV: test
      APP_BASE_URL: http://127.0.0.1:3000
      CLIENT_URL: http://127.0.0.1:3000
      JWT_SECRET: test-jwt-secret
      NEXT_PUBLIC_HOSTNAME: http://127.0.0.1:3000
      NEXT_PUBLIC_REDIRECT_URI: http://127.0.0.1:3000/api/auth/google/callback
      NEXT_PUBLIC_WS_URL: http://127.0.0.1:4000
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: postgres
      PG_DB: axxon_test
      PG_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5432/axxon_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm build

  migration_check:
    runs-on: ubuntu-latest
    needs: lint_and_typecheck
    defaults:
      run:
        working-directory: axxon
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axxon_migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axxon_migration_check"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: postgres
      PG_DB: axxon_migration_check
      PG_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5432/axxon_migration_check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate:latest
      - run: pnpm migrate:latest

  backend_tests:
    runs-on: ubuntu-latest
    needs: lint_and_typecheck
    defaults:
      run:
        working-directory: axxon
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axxon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axxon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_BASE_URL: http://127.0.0.1:3000
      CLIENT_URL: http://127.0.0.1:3000
      JWT_SECRET: test-jwt-secret
      NEXT_PUBLIC_HOSTNAME: http://127.0.0.1:3000
      NEXT_PUBLIC_REDIRECT_URI: http://127.0.0.1:3000/api/auth/google/callback
      NEXT_PUBLIC_WS_URL: http://127.0.0.1:4000
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: postgres
      PG_DB: axxon_test
      PG_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5432/axxon_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:backend

  frontend_tests:
    runs-on: ubuntu-latest
    needs: lint_and_typecheck
    defaults:
      run:
        working-directory: axxon
    env:
      NODE_ENV: test
      APP_BASE_URL: http://127.0.0.1:3000
      JWT_SECRET: test-jwt-secret
      NEXT_PUBLIC_HOSTNAME: http://127.0.0.1:3000
      NEXT_PUBLIC_REDIRECT_URI: http://127.0.0.1:3000/api/auth/google/callback
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:frontend

  planning_eval_smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.planning_eval_tier == 'smoke')
    runs-on: ubuntu-latest
    needs: lint_and_typecheck
    defaults:
      run:
        working-directory: axxon
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:planning:smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-eval-smoke
          path: axxon/.eval-runs/planning/**

  planning_eval_golden:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.planning_eval_tier == 'golden')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axxon
    env:
      NODE_ENV: test
      EVAL_PLANNING_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:planning:golden

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-eval-golden
          path: axxon/.eval-runs/planning/**

  planning_eval_judge:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.planning_eval_tier == 'judge')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axxon
    env:
      NODE_ENV: test
      EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
      EVAL_JUDGE_BASE_URL: ${{ secrets.EVAL_JUDGE_BASE_URL }}
      EVAL_JUDGE_MODEL: ${{ secrets.EVAL_JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:planning:judge

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-eval-judge
          path: axxon/.eval-runs/planning/**

  planning_eval_release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.planning_eval_tier == 'release')
    runs-on: ubuntu-latest
    needs:
      - backend_tests
      - frontend_tests
    defaults:
      run:
        working-directory: axxon
    env:
      NODE_ENV: test
      EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
      EVAL_JUDGE_BASE_URL: ${{ secrets.EVAL_JUDGE_BASE_URL }}
      EVAL_JUDGE_MODEL: ${{ secrets.EVAL_JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm eval:planning:release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-eval-release
          path: axxon/.eval-runs/planning/**

  run_production_migrations:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - lint_and_typecheck
      - migration_check
      - backend_tests
      - frontend_tests
      - planning_eval_smoke
      - planning_eval_release
    defaults:
      run:
        working-directory: axxon
    environment: production
    concurrency:
      group: production-migrations-main
      cancel-in-progress: false
    env:
      AXXON_DEPLOY_STAGE: production
      NODE_ENV: production
      PG_CONNECTION_STRING: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate:latest:prod

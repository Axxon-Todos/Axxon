name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint_and_typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axxon
    env:
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: postgres
      PG_DB: axxon_test
      PG_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5432/axxon_test
      REDIS_URL: redis://127.0.0.1:6379
      CLIENT_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_WS_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm build

  backend_tests:
    runs-on: ubuntu-latest
    needs: lint_and_typecheck
    defaults:
      run:
        working-directory: axxon
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axxon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axxon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: postgres
      PG_DB: axxon_test
      PG_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5432/axxon_test
      REDIS_URL: redis://127.0.0.1:6379
      CLIENT_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_WS_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:backend

  frontend_tests:
    runs-on: ubuntu-latest
    needs: lint_and_typecheck
    defaults:
      run:
        working-directory: axxon
    env:
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:frontend

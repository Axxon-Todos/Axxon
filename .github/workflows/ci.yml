# Runs pull request validation for main, verifies migrations against a throwaway database, and applies production migrations on main pushes.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint_and_typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axxon
    env:
      NODE_ENV: test
      APP_BASE_URL: http://127.0.0.1:3000
      CLIENT_URL: http://127.0.0.1:3000
      JWT_SECRET: test-jwt-secret
      NEXT_PUBLIC_HOSTNAME: http://127.0.0.1:3000
      NEXT_PUBLIC_REDIRECT_URI: http://127.0.0.1:3000/api/auth/google/callback
      NEXT_PUBLIC_WS_URL: http://127.0.0.1:4000
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: postgres
      PG_DB: axxon_test
      PG_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5432/axxon_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm build

  migration_check:
    runs-on: ubuntu-latest
    needs: lint_and_typecheck
    defaults:
      run:
        working-directory: axxon
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axxon_migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axxon_migration_check"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: postgres
      PG_DB: axxon_migration_check
      PG_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5432/axxon_migration_check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate:latest
      - run: pnpm migrate:latest

  backend_tests:
    runs-on: ubuntu-latest
    needs: lint_and_typecheck
    defaults:
      run:
        working-directory: axxon
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axxon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axxon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_BASE_URL: http://127.0.0.1:3000
      CLIENT_URL: http://127.0.0.1:3000
      JWT_SECRET: test-jwt-secret
      NEXT_PUBLIC_HOSTNAME: http://127.0.0.1:3000
      NEXT_PUBLIC_REDIRECT_URI: http://127.0.0.1:3000/api/auth/google/callback
      NEXT_PUBLIC_WS_URL: http://127.0.0.1:4000
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: postgres
      PG_DB: axxon_test
      PG_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5432/axxon_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:backend

  frontend_tests:
    runs-on: ubuntu-latest
    needs: lint_and_typecheck
    defaults:
      run:
        working-directory: axxon
    env:
      NODE_ENV: test
      APP_BASE_URL: http://127.0.0.1:3000
      JWT_SECRET: test-jwt-secret
      NEXT_PUBLIC_HOSTNAME: http://127.0.0.1:3000
      NEXT_PUBLIC_REDIRECT_URI: http://127.0.0.1:3000/api/auth/google/callback
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:frontend

  run_production_migrations:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - lint_and_typecheck
      - migration_check
      - backend_tests
      - frontend_tests
    defaults:
      run:
        working-directory: axxon
    environment: production
    concurrency:
      group: production-migrations-main
      cancel-in-progress: false
    env:
      AXXON_DEPLOY_STAGE: production
      NODE_ENV: production
      PG_CONNECTION_STRING: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axxon/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate:latest:prod
